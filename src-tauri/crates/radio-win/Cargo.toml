[package]
name = "radio-win"
version = "0.1.0"
description = "Windows radio control for Waves mesh: WiFi-Direct legacy-AP host + WlanConnect joiner"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    # HOST (WinRT legacy-AP publisher)
    "Devices_WiFiDirect",
    "Security_Credentials",
    "Foundation",
    # ConnectionRequested → WiFiDirectDevice lifetime management
    "Devices_Enumeration",
    "Foundation_Collections",
    "Networking",
    # JOIN (Win32 WLAN)
    "Win32_NetworkManagement_WiFi",
    "Win32_Foundation",
]
