# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit config tuned for Waves — a JS/JSX (React 19 + Vite) frontend and a
# Node/Express + Socket.IO backend. Goals:
#   1. Speed: only run the tools/languages this repo actually uses.
#   2. Better checks: repo-specific review instructions + custom pre-merge gates
#      that mirror the load-bearing conventions in CLAUDE.md.
#   3. Ignore noise: lock files, build output, vendored assets, binaries.

language: "en-US"
tone_instructions: ""

reviews:
  # "assertive" surfaces more substantive issues than "chill" — we want thorough
  # review on a P2P/WebRTC + auth app where subtle regressions are costly.
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  commit_status: true
  fail_commit_status: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: true
  suggested_reviewers: true
  poem: false
  abort_on_close: true

  # ---------------------------------------------------------------------------
  # Ignore non-important files. CodeRabbit won't review or summarize these,
  # which both speeds reviews up and removes noise from walkthroughs.
  # ---------------------------------------------------------------------------
  path_filters:
    - "!**/package-lock.json"
    - "!**/node_modules/**"
    - "!frontend/dist/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/coverage/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.svg"
    - "!**/*.ico"

  # ---------------------------------------------------------------------------
  # Repo-specific review guidance. These encode the load-bearing conventions
  # from CLAUDE.md so CodeRabbit flags violations instead of generic nits.
  # ---------------------------------------------------------------------------
  path_instructions:
    - path: "frontend/src/components/Chat.jsx"
      instructions: |
        Messaging is P2P-first: WebRTC data channels between peers, with every
        message ALSO emitted to the server for persistence/fallback. Receivers
        dedup by message ID (P2P messages carry a tempId the server copy later
        upserts). Flag any change to message flow that could break this dedup
        (doubled messages) or drop the server echo. This file is ~800 lines —
        flag mechanical line-slicing or whitespace/name compaction; expect
        refactors to extract cohesive units (WebRTC peer logic, socket
        lifecycle, hooks, sub-components) instead.
    - path: "frontend/src/**/*.{js,jsx}"
      instructions: |
        Render message timestamps in the user's LOCAL timezone
        (new Date(value).toLocaleString() or a relative-time helper). Flag raw
        UTC strings or getUTC* accessors used for display. REST calls use axios
        with withCredentials:true and relative /api/... paths — flag absolute
        backend URLs or missing credentials.
    - path: "backend/src/libs/socket.js"
      instructions: |
        Each WebRTC signaling handler (webrtc-offer / webrtc-answer /
        webrtc-ice-candidate) MUST verify the sender and target share a
        Socket.IO room before relaying. Flag any signaling relay that skips this
        check. The shared app/server/io instances are created here.
    - path: "backend/src/**/*.js"
      instructions: |
        Room names are load-bearing and must stay consistent across Socket.IO
        rooms, Mongo Room docs, and frontend routes: "global",
        "network-<first-3-IP-octets>", "custom-<CODE>". Auth uses a JWT in an
        httpOnly "jwt" cookie validated by auth.middleware.js (sets req.user).
        App wiring belongs in app.js; index.js stays thin. Flag new files that
        duplicate an existing route/controller/model/helper responsibility.
    - path: "backend/src/libs/allowedOrigins.js"
      instructions: |
        This is the SINGLE source of CORS origins, imported by both app.js and
        libs/socket.js. Flag any PR that reintroduces a duplicate origins list
        in either file. New deployment origins belong here or via the
        CLIENT_ORIGINS env var.
    - path: "docs/**/*.md"
      instructions: |
        docs/ is the current-state reference. Per docs/README.md ownership map,
        a code change must update its matching doc in the same PR: model ->
        DATABASE_SCHEMA.md, endpoint -> API.md, socket/WebRTC event ->
        REALTIME.md, backend module -> BACKEND_STRUCTURE.md, frontend
        component/route -> FRONTEND_STRUCTURE.md.

  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: []
    drafts: false
    base_branches: []

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  # ---------------------------------------------------------------------------
  # Pre-merge gates. Built-in checks plus custom checks mirroring CLAUDE.md
  # working practices. These run as warnings so they inform without hard-blocking
  # routine merges; tighten individual modes to "error" to enforce them.
  # ---------------------------------------------------------------------------
  pre_merge_checks:
    docstrings:
      mode: "off"        # plain JS/JSX, no docstring-coverage expectation
      threshold: 80
    title:
      mode: "warning"
      requirements: "Concise, descriptive, and ideally prefixed with a Conventional Commit type (feat/fix/docs/refactor/test/chore) to match this repo's commit history."
    description:
      mode: "warning"
    issue_assessment:
      mode: "warning"
    custom_checks:
      - name: "Docs kept in sync"
        mode: "warning"
        instructions: |
          Per CLAUDE.md and docs/README.md, code changes must update the matching
          doc in the same PR. If a PR changes a Mongoose model, REST endpoint,
          Socket.IO/WebRTC event, or a backend/frontend module without touching
          the corresponding file under docs/ (DATABASE_SCHEMA.md, API.md,
          REALTIME.md, BACKEND_STRUCTURE.md, FRONTEND_STRUCTURE.md), warn that
          docs may be out of sync.
      - name: "Tests accompany behavior changes"
        mode: "warning"
        instructions: |
          Per CLAUDE.md, behavior changes should add or extend tests. If a PR
          changes backend controllers/middleware/socket logic or frontend
          component logic without adding/updating tests (backend Vitest +
          Supertest, frontend Vitest + React Testing Library), warn that
          coverage may be missing. Note when messaging changes need the manual
          two-client WebRTC + server-fallback dedup verification that automated
          tests can't cover.
      - name: "No CORS origin duplication"
        mode: "warning"
        instructions: |
          CORS origins must live only in backend/src/libs/allowedOrigins.js. Fail
          if a PR adds a second hardcoded origins/allowlist array in app.js or
          libs/socket.js.

  tools:
    # --- Enabled: tools that match this repo's stack ---
    ast-grep:
      essential_rules: true
      rule_dirs: []
      util_dirs: []
      packages: []
    eslint:
      enabled: true          # frontend + backend both lint with ESLint
    shellcheck:
      enabled: true          # .claude/*.sh hook & lib scripts
    markdownlint:
      enabled: true          # README + docs/*.md
    yamllint:
      enabled: true          # this file + .github/workflows
    actionlint:
      enabled: true          # .github/workflows/ci.yml
    gitleaks:
      enabled: true          # secret scanning (JWT_SECRET, MONGODB_URI, etc.)
    semgrep:
      enabled: true          # security/code-quality static analysis
    osvScanner:
      enabled: true          # npm dependency vulnerability scanning
    github-checks:
      enabled: true          # surface CI (ci.yml) results in review
      timeout_ms: 90000

    # --- Disabled: not part of this stack (skipping these speeds reviews up) ---
    languagetool:
      enabled: false         # prose grammar — noisy on technical docs
    biome:
      enabled: false         # redundant with ESLint
    oxc:
      enabled: false         # redundant with ESLint
    htmlhint:
      enabled: false         # only the Vite index.html template
    dotenvLint:
      enabled: false         # repo tracks .env.example templates only
    ruff:
      enabled: false         # no Python
    flake8:
      enabled: false         # no Python
    pylint:
      enabled: false         # no Python
    swiftlint:
      enabled: false         # no Swift
    golangci-lint:
      enabled: false         # no Go
    detekt:
      enabled: false         # no Kotlin
    buf:
      enabled: false         # no Protobuf
    hadolint:
      enabled: false         # no Dockerfile
    checkov:
      enabled: false         # no IaC
    prismaLint:
      enabled: false         # no Prisma schema

chat:
  art: true
  auto_reply: true

knowledge_base:
  opt_out: true
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    # Teach CodeRabbit this repo's standards from its own guideline docs.
    filePatterns:
      - "**/CLAUDE.md"
      - "docs/**/*.md"
      - "README.md"
  learnings:
    scope: "auto"
  issues:
    scope: "auto"

code_generation:
  docstrings:
    language: "en-US"
    path_instructions: []
  unit_tests:
    path_instructions: []
