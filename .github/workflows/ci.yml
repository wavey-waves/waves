name: CI

# Runs the same gates as `npm run check` (backend) and lint/test/build (frontend)
# on every push to main and every pull request, plus an advisory dependency audit.
on:
  push:
    # offline-mesh: long-running mesh feature branch — the Windows mesh job
    # below is its only true-Windows verification, so CI runs on every push.
    branches: [main, offline-mesh]
  pull_request:
  workflow_dispatch: # allow manual runs from the Actions tab

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint · typecheck · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (tsc --checkJs)
        run: npm run typecheck

      - name: Test (vitest + in-memory MongoDB)
        run: npm test

  frontend:
    name: Frontend · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (vitest + jsdom + RTL)
        run: npm test

      - name: Build (vite build)
        run: npm run build

  # Mesh (src-tauri workspace). Two jobs: Linux runs the protocol tests fast;
  # Windows is the only place the Tauri app crate and radio-win actually
  # compile-check (WebView2/WinRT deps can't cross-check from Linux — ring's
  # build script needs MSVC tooling).
  mesh-linux:
    name: Mesh · cargo test + clippy (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: src-tauri

      - name: Test (mesh-core + spike)
        run: cargo test

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

  mesh-windows:
    name: Mesh · full workspace check + test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Tauri app crate embeds frontendDist at compile time, so the
      # frontend must be built before the workspace check.
      - name: Build frontend (prerequisite for tauri generate_context)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: src-tauri

      - name: Check full workspace (app crate + radio-win included)
        working-directory: src-tauri
        run: cargo check --workspace --all-targets

      - name: Test on Windows (mesh-core protocol + net over loopback)
        working-directory: src-tauri
        run: cargo test

  # Blocking gate: both packages are currently clean at high+ severity. Fails
  # the build if a high or critical advisory is introduced (directly or via a
  # transitive dep). Note this can also go red when a NEW advisory is published
  # against an existing dependency with no code change — triage by bumping the
  # dep (`npm audit fix`) or, if no fix is yet available, temporarily relax
  # `--audit-level` or re-add `continue-on-error` while it's resolved.
  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high and above)
        run: npm audit --audit-level=high
